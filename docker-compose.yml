# A local, production-shaped stack (Postgres + the built web image) for
# verifying the Docker build actually runs end-to-end before trusting it
# in a real deployment. Not a production deployment manifest itself — a
# real deployment needs a managed Postgres instance, secrets from a real
# secrets manager (not this file's env vars), and the AUTH_SECRET/
# STRIPE_*/ANTHROPIC_API_KEY values a real environment provides (see
# docs/phase-13/README.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ltp_dev_password
      POSTGRES_DB: ltp_calculator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: `docker compose run --rm migrate` applies pending Prisma
  # migrations. Deliberately not part of the `web` service's startup —
  # auto-migrating on every container boot races badly with multiple
  # replicas starting at once; run this explicitly as a deploy step instead.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:ltp_dev_password@postgres:5432/ltp_calculator
    command: ["pnpm", "--filter", "@ltp/db", "exec", "prisma", "migrate", "deploy"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:ltp_dev_password@postgres:5432/ltp_calculator
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET before running (openssl rand -base64 32) — never commit a real one}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}

volumes:
  postgres_data:
