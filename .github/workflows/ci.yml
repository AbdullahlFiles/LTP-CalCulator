name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ltp_calculator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/ltp_calculator
      # CI-only value — never a real secret, and never reused anywhere else.
      AUTH_SECRET: ci-only-secret-not-for-production-use
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ltp/db exec prisma generate

      - name: Apply database migrations
        run: pnpm --filter @ltp/db exec prisma migrate deploy

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm --filter web lint

      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm --filter web build

      - name: Audit dependencies (report only — see docs/phase-12/README.md for accepted findings)
        run: pnpm audit --audit-level=critical || true
